    <script>
      // Suppress benign Vite HMR WebSocket closed errors in AI Studio iframe environment
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && String(e.reason).includes('WebSocket')) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function(e) {
        if (e && (String(e.message).includes('WebSocket') || String(e.error).includes('WebSocket'))) {
          e.preventDefault();
        }
      });
    </script>
